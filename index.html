<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="top_row">

    <div class="farm_selection">
        <h2>Farm Layout Generator</h2>
        
        <!-- Farm selection -->
        <label for="farm">Select a farm:</label>
        <select name="farm" id="farm_selector" onchange="farm_selection_changed()">
            <optgroup id="critter_farm" label="critter farms">
                <option value="one_critter">critter farm (only one critter type)</option>
            </optgroup>
            <optgroup id="fish_farm" label="fish farms">
                <option value="five_fish">fish farm (up to five fish types)</option>
            </optgroup>
        </select>

        <!-- Scale slider (hidden by default) -->
        <label id="scale_x_slider_label" for="farm_size" style="display:none">
            <span id="scale_x_slider_label_text">Value</span>: 
            <span id="scale_x_slider_label_value">50</span>
        </label>
        <input type="range" id="scale_x_slider" min="0" max="0" step="2" value="0" style="display:none" oninput="scale_x_slider_changed()">

        <label>
            <input type="checkbox" id="toggle_adanced_settings_checkbox" onchange="toggleAdancedSettings(this)">
            show advanced settings
        </label>

        <div id="advanced_settings_container">
            <!-- Background selection -->
            <label for="background_selection">Select a background:</label>
            <select name="background_selection" id="background_selection" onchange="generate_farm()">
                <optgroup label="default">
                    <option value="default">default</option>
                </optgroup>
                <optgroup label="black-blue">
                    <option value="blue_2x2">blue_2x2</option>
                    <option value="blue_3x3">blue_3x3</option>
                    <option value="blue_4x4">blue_4x4</option>
                    <option value="blue_5x5">blue_5x5</option>
                </optgroup>
            </select>

            <!-- Image size slider -->
            <label id="image_size_slider_label" for="farm_size">
                <span id="image_size_slider_label_text">Size of output images</span>: 
                <span id="image_size_slider_label_value">3</span>
            </label>
            <input type="range" id="image_size_slider" min="1" max="5" value="3" oninput="image_size_slider_changed()">
        </div>

        <!-- Update button -->
        <button onclick="generate_farm()">Update</button>

        
    </div>

    <div class="info_panel">
        <h3 id="info_farm_name">Farm name</h3>
        <p id="info_farm_description">Farm description</p>

        <table id="info_rating_table">
            <!-- 
            <tr>
                <th>Category</th>
                <th>Rating</th>
            </tr>
            -->
            <tr>
                <td>width</td>
                <td id="info_table_width"></td>
            </tr>
            <tr>
                <td>height</td>
                <td id="info_table_height"></td>
            </tr>
            <tr>
                <td id="info_table_output_rate_label">XXX per hour</td>
                <td id="info_table_output_rate"></td>
            </tr>
            <tr id="rating_separator">
                <td>space efficiency</td>
                <td id="info_table_space_rating"></td>
            </tr>
            <tr>
                <td>output rate</td>
                <td id="info_table_output_rating"></td>
            </tr>
            <tr>
                <td>resource cost</td>
                <td id="info_table_resource_rating"></td>
            </tr>
        </table>

        <!-- Explanation link -->
        <a id="explanation_link" href="https://www.reddit.com/user/Dizzy_Possible1147" target="_blank" class="btn">Go to explanation of farm</a>

        <p id="info_creator">Design by: could not load</p>
    </div>
</div>

<!-- Output -->
<div class="output_wrapper">
    <div id="output_layers"></div>
</div>

<script src="script.js"></script>
</body>
</html>
